name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 19
          sudo apt-get install -y clang-19 lld-19 libc++-19-dev libc++abi-19-dev python3-dev \
            libboost-dev libglm-dev libgsl-dev

      - name: Checkout Endstone headers
        uses: actions/checkout@v4
        with:
          repository: EndstoneMC/endstone
          ref: v0.11.14
          path: endstone

      - name: Build
        env:
          ENDSTONE_SRC: ${{ github.workspace }}/endstone/src
          ENDSTONE_INC: ${{ github.workspace }}/endstone/include
        run: bash scripts/build_linux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: endstone_structbridge-linux
          path: dist/endstone_structbridge.so
          if-no-files-found: error

  windows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 19
          sudo apt-get install -y clang-19 lld-19 libboost-dev libglm-dev libgsl-dev

      - name: Fetch MSVC CRT and Windows SDK
        run: |
          curl -fsSL -o xwin.tar.gz \
            https://github.com/Jake-Shadle/xwin/releases/download/0.10.0/xwin-0.10.0-x86_64-unknown-linux-musl.tar.gz
          tar xzf xwin.tar.gz
          sudo ./xwin-0.10.0-x86_64-unknown-linux-musl/xwin --accept-license --arch x86_64 splat --output /opt/msvc --disable-symlinks

      - name: Checkout Endstone headers
        uses: actions/checkout@v4
        with:
          repository: EndstoneMC/endstone
          ref: v0.11.14
          path: endstone

      - name: Build
        env:
          ENDSTONE_SRC: ${{ github.workspace }}/endstone/src
          ENDSTONE_INC: ${{ github.workspace }}/endstone/include
        run: bash scripts/build_windows.sh

      - uses: actions/upload-artifact@v4
        with:
          name: endstone_structbridge-windows
          path: dist/endstone_structbridge.dll
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: |
            artifacts/endstone_structbridge-linux/endstone_structbridge.so
            artifacts/endstone_structbridge-windows/endstone_structbridge.dll
